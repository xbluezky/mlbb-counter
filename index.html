<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MLBB Counter Build</title>
<meta name="description" content="Rekomendasi item counter berdasarkan hero lu dan 5 hero lawan.">
<meta name="theme-color" content="#0d1220">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: draft board (sisi biru = lu, sisi merah = lawan) di kiri, build hasil di kanan; satu kolom di HP. */
:root {
  --bg: #eef1f6; --panel: #ffffff; --panel-2: #f5f7fb; --line: #d9dfea;
  --ink: #141a2a; --muted: #5a6378;
  --blue: #2a63f0; --blue-soft: #e3ebff; --red: #d63c33; --red-soft: #fde6e4;
  --gold: #a87a12; --gold-soft: #f8edd2; --good: #1f8a5b; --good-soft: #dcf3e8;
  --f-display: "Chakra Petch", "Rajdhani", "Segoe UI", system-ui, sans-serif;
  --f-body: "Barlow", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r: 10px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0b1020; --panel: #131a2c; --panel-2: #182136; --line: #26314b;
  --ink: #e8ecf5; --muted: #8b95ad;
  --blue: #6b95ff; --blue-soft: #1a2853; --red: #ff6d62; --red-soft: #3a1c22;
  --gold: #e6bb55; --gold-soft: #3a2f14; --good: #4cc98f; --good-soft: #13372a;
  color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #0b1020; --panel: #131a2c; --panel-2: #182136; --line: #26314b;
  --ink: #e8ecf5; --muted: #8b95ad;
  --blue: #6b95ff; --blue-soft: #1a2853; --red: #ff6d62; --red-soft: #3a1c22;
  --gold: #e6bb55; --gold-soft: #3a2f14; --good: #4cc98f; --good-soft: #13372a;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.45; }
.wrap { max-width: 1120px; margin: 0 auto; padding-inline: 16px; padding-block: 18px 40px; }
button { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

header.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
.brand { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.brand h1 { font-family: var(--f-display); font-weight: 700; font-size: 1.45rem; letter-spacing: .02em; margin: 0; text-wrap: balance; }
.brand h1 span { color: var(--gold); }
.patch { font-family: var(--f-mono); font-size: .72rem; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 2px 9px; }
.top-actions { display: flex; gap: 8px; }
.btn { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 7px 12px; cursor: pointer; font-weight: 500; font-size: .88rem; }
.btn:hover { border-color: var(--muted); }

.grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); gap: 16px; align-items: start; }
@media (max-width: 860px) { .grid { grid-template-columns: minmax(0, 1fr); } }

.side { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.side + .side { margin-top: 14px; }
.side-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 14px; border-bottom: 1px solid var(--line); }
.side-head h2 { margin: 0; font-family: var(--f-display); font-size: .82rem; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; }
.side.blue .side-head { background: var(--blue-soft); } .side.blue .side-head h2 { color: var(--blue); }
.side.red .side-head { background: var(--red-soft); } .side.red .side-head h2 { color: var(--red); }
.side-head small { color: var(--muted); font-size: .78rem; }

.lanes { display: flex; gap: 6px; flex-wrap: wrap; padding: 12px 14px 0; }
.chip { border: 1px solid var(--line); background: var(--panel-2); border-radius: 999px; padding: 4px 11px; font-size: .8rem; cursor: pointer; font-weight: 500; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

.row { display: grid; grid-template-columns: 58px minmax(0, 1fr) auto; align-items: center; gap: 10px; padding: 9px 14px; }
.side.red .row + .row { border-top: 1px solid var(--line); }
.lane-tag { font-family: var(--f-display); font-weight: 600; font-size: .74rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.pick { display: flex; align-items: center; gap: 10px; min-width: 0; text-align: left; border: 1px dashed var(--line); background: transparent; border-radius: 8px; padding: 6px 8px; cursor: pointer; width: 100%; }
.pick.filled { border-style: solid; background: var(--panel-2); }
.pick:hover { border-color: var(--muted); }
.av { flex: none; width: 34px; height: 34px; border-radius: 8px; display: grid; place-items: center; font-family: var(--f-display); font-weight: 700; font-size: .85rem; background: var(--line); color: var(--ink); }
.av.p { background: var(--red-soft); color: var(--red); }
.av.m { background: var(--blue-soft); color: var(--blue); }
.av.x { background: var(--gold-soft); color: var(--gold); }
.pick .nm { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pick .sub { font-size: .76rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pick .txt { min-width: 0; display: grid; }
.me-row { grid-template-columns: minmax(0, 1fr); padding: 12px 14px 14px; }
.fed { border: 1px solid var(--line); background: transparent; border-radius: 6px; padding: 5px 9px; font-family: var(--f-display); font-weight: 600; font-size: .72rem; letter-spacing: .08em; cursor: pointer; color: var(--muted); }
.fed[aria-pressed="true"] { background: var(--red); border-color: var(--red); color: #fff; }
.fed:disabled { opacity: .35; cursor: default; }

/* Result */
.result { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); }
@media (max-width: 860px) { .result { position: static; } }
.r-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; flex-wrap: wrap; }
.r-head h2 { margin: 0; font-family: var(--f-display); font-size: 1.15rem; font-weight: 700; text-wrap: balance; }
.r-head p { margin: 2px 0 0; color: var(--muted); font-size: .85rem; }
.example { font-family: var(--f-display); font-size: .7rem; letter-spacing: .1em; text-transform: uppercase; background: var(--gold-soft); color: var(--gold); border-radius: 4px; padding: 3px 7px; font-weight: 600; }

.build { list-style: none; margin: 14px 0 0; padding: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; counter-reset: s; }
@media (max-width: 480px) { .build { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.slot { border: 1px solid var(--line); border-radius: 8px; padding: 9px 10px 10px; display: grid; gap: 4px; align-content: start; background: var(--panel-2); min-width: 0; }
.slot .no { font-family: var(--f-mono); font-size: .7rem; color: var(--muted); display: flex; justify-content: space-between; align-items: center; gap: 6px; }
.slot .it { font-weight: 600; font-size: .92rem; line-height: 1.2; }
.slot .ds { font-size: .76rem; color: var(--muted); line-height: 1.3; }
.slot .was { font-size: .74rem; color: var(--muted); }
.slot .was s { opacity: .8; }
.st { font-family: var(--f-display); font-size: .64rem; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; border-radius: 3px; padding: 1px 6px; }
.st.core { background: var(--line); color: var(--muted); }
.st.fit { background: var(--good-soft); color: var(--good); }
.st.counter { background: var(--gold-soft); color: var(--gold); }
.slot.counter { border-color: var(--gold); }
.slot.fit { border-color: var(--good); }

.sec { margin-top: 18px; }
.sec h3 { margin: 0 0 8px; font-family: var(--f-display); font-size: .74rem; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.meter { display: flex; height: 10px; border-radius: 999px; overflow: hidden; background: var(--line); }
.meter .ph { background: var(--red); } .meter .mg { background: var(--blue); }
.meter-lbl { display: flex; justify-content: space-between; font-family: var(--f-mono); font-size: .74rem; margin-top: 5px; font-variant-numeric: tabular-nums; }
.meter-lbl .a { color: var(--red); } .meter-lbl .b { color: var(--blue); }
.threats { display: flex; flex-wrap: wrap; gap: 6px; }
.th { border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; font-size: .8rem; display: flex; gap: 6px; align-items: center; }
.th b { font-family: var(--f-mono); font-weight: 500; font-variant-numeric: tabular-nums; }
.th.tinggi { border-color: var(--red); color: var(--red); }
.th.sedang { border-color: var(--gold); }
.th.rendah { color: var(--muted); }
.why { margin: 0; padding-left: 18px; display: grid; gap: 6px; font-size: .88rem; max-width: 62ch; }
.why b { font-weight: 600; }
.notes { margin: 0; padding: 0; list-style: none; display: grid; gap: 5px; font-size: .85rem; color: var(--muted); }
.notes li::before { content: "› "; color: var(--gold); }
.empty { color: var(--muted); padding: 22px 4px; text-align: center; font-size: .92rem; }
.foot { margin-top: 22px; font-size: .78rem; color: var(--muted); max-width: 70ch; }
.foot a { color: inherit; }

/* Picker */
dialog { border: 1px solid var(--line); border-radius: 14px; padding: 0; width: min(640px, calc(100vw - 24px)); max-height: min(86vh, 760px); background: var(--panel); color: var(--ink); }
dialog::backdrop { background: rgb(5 8 18 / .55); }
.pk { display: grid; grid-template-rows: auto auto minmax(0, 1fr); max-height: min(86vh, 760px); }
.pk-head { display: flex; gap: 8px; align-items: center; padding: 12px 14px; border-bottom: 1px solid var(--line); }
.pk-head h2 { margin: 0; font-family: var(--f-display); font-size: .95rem; flex: 1; }
.pk-search { padding: 10px 14px; display: grid; gap: 8px; border-bottom: 1px solid var(--line); }
.pk-search input { width: 100%; border: 1px solid var(--line); background: var(--panel-2); border-radius: 8px; padding: 9px 11px; font: inherit; color: var(--ink); }
.pk-lanes { display: flex; gap: 6px; flex-wrap: wrap; }
.pk-grid { overflow: auto; padding: 12px 14px 16px; display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 8px; align-content: start; }
.hb { border: 1px solid var(--line); background: var(--panel-2); border-radius: 8px; padding: 8px 6px; cursor: pointer; display: grid; justify-items: center; gap: 5px; text-align: center; min-width: 0; }
.hb:hover { border-color: var(--muted); }
.hb .av { width: 40px; height: 40px; font-size: .95rem; }
.hb span { font-size: .78rem; font-weight: 600; line-height: 1.15; overflow-wrap: anywhere; }
.hb[disabled] { opacity: .35; cursor: default; }
.pk-none { color: var(--muted); grid-column: 1 / -1; padding: 16px 0; }
@media (prefers-reduced-motion: no-preference) {
  .slot { transition: border-color .2s; }
  .slot.counter { animation: pop .35s ease-out; }
  @keyframes pop { from { transform: scale(.97); } to { transform: none; } }
}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>Counter<span>Build</span></h1>
      <span class="patch" id="patch">memuat data…</span>
    </div>
    <div class="top-actions">
      <button class="btn" id="btn-clear" type="button">Draft baru</button>
    </div>
  </header>

  <div class="grid">
    <section aria-label="Draft">
      <div class="side blue">
        <div class="side-head"><h2>Hero lu</h2><small id="me-arch"></small></div>
        <div class="lanes" id="me-lanes" role="group" aria-label="Role lu"></div>
        <div class="row me-row"><button class="pick" id="me-pick" type="button"></button></div>
      </div>
      <div class="side red">
        <div class="side-head"><h2>Lawan</h2><small>Tap <b>FED</b> kalau ada yang lagi gendut</small></div>
        <div id="enemy-rows"></div>
      </div>
    </section>

    <section class="result" id="result" aria-live="polite"></section>
  </div>

  <p class="foot" id="foot"></p>
</div>

<dialog id="picker">
  <div class="pk">
    <div class="pk-head"><h2 id="pk-title">Pilih hero</h2><button class="btn" id="pk-close" type="button">Tutup</button></div>
    <div class="pk-search">
      <input id="pk-q" type="search" placeholder="Cari hero…" autocomplete="off">
      <div class="pk-lanes" id="pk-lanes" role="group" aria-label="Filter lane"></div>
    </div>
    <div class="pk-grid" id="pk-grid"></div>
  </div>
</dialog>

<script src="engine.js"></script>
<script src="app.js"></script>
</body>
</html>
