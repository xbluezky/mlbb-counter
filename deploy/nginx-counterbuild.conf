# /etc/nginx/sites-available/counterbuild  (sesuaikan server_name & sertifikat)
server {
    listen 443 ssl http2;
    server_name build.contoh-domain-lu.id;

    ssl_certificate     /etc/letsencrypt/live/build.contoh-domain-lu.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/build.contoh-domain-lu.id/privkey.pem;

    root /var/www/counterbuild;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Data hasil sync: selalu revalidasi biar patch baru langsung kepakai
    location /data/ {
        add_header Cache-Control "no-cache";
        location ~ \.bak$ { deny all; }
    }
    location = /sw.js { add_header Cache-Control "no-cache"; }
    location = /manifest.webmanifest { types { application/manifest+json webmanifest; } }

    location ~* \.(js|css|png|svg)$ { add_header Cache-Control "public, max-age=86400"; }

    location / { try_files $uri $uri/ =404; }
}

server {
    listen 80;
    server_name build.contoh-domain-lu.id;
    return 301 https://$host$request_uri;
}
